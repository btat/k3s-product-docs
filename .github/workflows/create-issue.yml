name: Create issue to track porting between Community and Product docs

on:
  pull_request_target:
    types:
      - open
      - closed
      - edited
    branches: 
      - main
      - test-workflow
    paths-ignore:
      - '**/README.md'

permissions:
  issues: write
  pull-requests: read

jobs:
  create_issue:
    if: contains( github.event.pull_request.labels.*.name, 'port/community-product')
    runs-on: ubuntu-latest
    steps:
    - name: Create issue
      env:
        GH_TOKEN: ${{ github.token }}
        REPO_TYPE: ${{ contains( github.repository, 'product-docs') && 'Product' || 'Community' }}
      run: |
        repo_type='Community'
        if [[ ${{github.repository}} = *'product-docs' ]]; then
          repo_type='Product'
        fi
        gh issue create \
          --repo ${{github.repository}} \
          --title 'Port ${{ REPO_TYPE }} docs PR #${{ github.event.pull_request.number }}: ${{ github.event.pull_request.title }}' \
          --body 'Reference: https://github.com/${{ github.repository }}/pull/${{ github.event.pull_request.number }}' \
          --label port/community-product 
