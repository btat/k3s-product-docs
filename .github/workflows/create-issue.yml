name: Create issue to port to Product docs

on:
  pull_request:
    types:
      - closed
    branches: 
      - main
      - test-workflow
    paths-ignore:
      - '**/README.md'

permissions: write-all
  # issues: write
  # pull-requests: read

jobs:
  create_issue:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
    - name: Create issue to port PR on product docs repo
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh issue create \
          --repo btat/k3s-product-docs \
          --title 'Port Community docs PR #${{github.event.pull_request.number}}: ${{github.event.pull_request.title}}' \
          --body 'Ref: https://github.com/${{github.repository}}/pull/${{github.event.pull_request.number}}' \
          --label port/from-community 
      