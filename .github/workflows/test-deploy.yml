name: Test deployment

on:
  pull_request:
    paths-ignore:
      - '**/README.md'

jobs:
  test-deploy:
    name: Test deployment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install Antora
        run: make environment
      - name: Generate Site
        run: make local
      - name: INFO issues
        run: |
          if [ grep "INFO (asciidoctor)" tmp/local-build.log ]
          then
            echo "INFO (asciidoctor) issue found"
            exit 1
          else
            exit 0
          fi