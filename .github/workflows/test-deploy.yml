name: Test deployment

on:
  pull_request:
    paths-ignore:
      - '**/README.md'
    types: [opened, edited, synchronize, reopened]

jobs:
  test-deploy:
    name: Test deployment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install Antora
        run: make environment
      - name: Generate Site
        # run: make local
        run: |
          npx antora --stacktrace \
            --log-file local-build.log \
            --log-format=pretty \
            --log-level=info \
            --log-failure-level=warn \
            playbook-local.yml 2>&1 | tee local-build.log 2>&1
            BUILD_STATUS=${PIPESTATUS[0]}
            echo "The value of BUILD_STATUS is $BUILD_STATUS"
  #        echo "BUILD_STATUS=${PIPESTATUS[0]}" >> $GITHUB_ENV
      # - name: View logs
      #   run: |
      #     echo "The value of BUILD_STATUS is $BUILD_STATUS"
      #     cat local-build.log
      - name: INFO issues
        run: |
          if grep "INFO (asciidoctor)" local-build.log; then
            echo "INFO (asciidoctor) issue found"
            exit 1
          else
            exit 0
          fi